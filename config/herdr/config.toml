onboarding = false

[ui]
sidebar_width = 32
prompt_new_tab_name = false
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true
pane_gaps = false
copy_on_select = true

status_indicators = "symbols"
[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "workspace"],
  ["terminal_title_stripped"],
]

[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", "workspace", "branch", "git_status"],
]

[experimental]
pane_history = false

# Herdr creates <repo>/<branch-slug> under here. The literal path is spelled
# out because herdr does not expand environment variables in this file — a
# "$WORKTREES" value is taken as a relative path and lands in $HOME. On macOS
# ~/worktrees is a link to the case-sensitive volume, so this one line holds
# for both platforms. Keep it in step with $WORKTREES in config/shell/os/.
[worktrees]
directory = "~/worktrees"
