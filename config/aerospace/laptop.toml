# AeroSpace — https://nikitabobko.github.io/AeroSpace/guide
# Defaults for anything not set here: /Applications/AeroSpace.app/Contents/Resources/default-config.toml

config-version = 2
start-at-login = true
auto-reload-config = true

# Workspace 3 is accordion; the padding leaves the neighbouring windows
# peeking at the edges so the stack is visible.
accordion-padding = 30

[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.left = 10
outer.right = 10
outer.top = 10
outer.bottom = 10

[mode.main.binding]
# Hyperkey sends ctrl+alt+shift+cmd together; AeroSpace has no 'hyper'
# modifier, so the chord it stands for is what gets bound.
ctrl-alt-shift-cmd-1 = 'workspace 1'   # Ghostty
ctrl-alt-shift-cmd-2 = 'workspace 2'   # Arc
ctrl-alt-shift-cmd-3 = 'workspace 3'   # comms
ctrl-alt-shift-cmd-4 = 'workspace 4'   # Linear + Things
ctrl-alt-shift-cmd-tab = 'workspace-back-and-forth'

# Group the focused window with its neighbour into a container. Nested
# containers take the opposite orientation, so joining two windows in a
# side-by-side workspace stacks them and leaves the others untouched.
ctrl-alt-shift-cmd-w = 'join-with up'
ctrl-alt-shift-cmd-a = 'join-with left'
ctrl-alt-shift-cmd-s = 'join-with down'
ctrl-alt-shift-cmd-d = 'join-with right'

# Reset the whole workspace to a flat layout. Flatten first, otherwise
# 'layout' would only reorient the container the focused window sits in.
ctrl-alt-shift-cmd-h = ['flatten-workspace-tree', 'layout h_tiles']
ctrl-alt-shift-cmd-v = ['flatten-workspace-tree', 'layout v_tiles']

# Move focus between windows in the current workspace.
ctrl-alt-shift-cmd-leftSquareBracket = 'focus left'
ctrl-alt-shift-cmd-rightSquareBracket = 'focus right'

# Toggle between the laptop and external-monitor configs. Keep this binding
# in every config — without it there is no way back.
ctrl-alt-shift-cmd-backtick = 'exec-and-forget /bin/bash -c "$HOME/.dotfiles/config/aerospace/switch-config.sh"'

# Send apps to their workspace automatically. Anything without a rule below
# opens on whatever workspace is focused at the time.
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'company.thebrowser.Browser'
run = 'move-node-to-workspace 2'

# Comms. Accordion so each window fills the screen, including the message
# windows Mimestream opens.
[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = ['move-node-to-workspace 3', 'layout h_accordion']

[[on-window-detected]]
if.app-id = 'com.mimestream.Mimestream'
run = ['move-node-to-workspace 3', 'layout h_accordion']

# Linear and Things.
[[on-window-detected]]
if.app-id = 'com.linear'
run = ['move-node-to-workspace 4', 'layout h_accordion']

[[on-window-detected]]
if.app-id = 'com.culturedcode.ThingsMac'
run = ['move-node-to-workspace 4', 'layout h_accordion']
