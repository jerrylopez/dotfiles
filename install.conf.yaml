- defaults:
    link:
      relink: true
      force: true

- clean: ["~", "~/.cache"]

# The links every machine wants. Anything whose target path or whose
# application is OS-specific belongs in install.<platform>.conf.yaml instead.
- link:
    ~/.gitconfig: config/git/gitconfig
    ~/.gitignore: config/git/gitignore
    ~/.zshrc: config/zsh/zshrc
    ~/.composer/composer.json: config/composer/composer.json
    ~/.claude/settings.json: config/claude/settings.json
    ~/.claude/skills: config/agents/skills
    ~/.agents/skills: config/agents/skills
    ~/.agents/.skill-lock.json: config/agents/.skill-lock.json

- shell:
    - [git submodule update --init --recursive]
