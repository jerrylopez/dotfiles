# Run after install.conf.yaml, by script/install.
#
# The box is headless, so most GUI links belong to install.macos.conf.yaml.
# What is here is Warden, which runs on this machine and not on the Mac.

- defaults:
    link:
      relink: true
      force: true

- link:
    # Only the commands directory is linked, never ~/.warden itself: that
    # holds the SSL private keys, the tunnel ssh_key and .installed, none of
    # which belong in a public repo. Warden looks here for a global command
    # before falling back to its built-ins.
    ~/.warden/commands:
      path: config/warden/commands
      create: true
    # herdr runs on this box as well as the Mac; the config itself is shared.
    ~/.config/herdr/config.toml:
      path: config/herdr/config.toml
      create: true
